[project]
name = "anywidget-graph"
version = "1.1.0"
description = "Interactive graph visualization for Python notebooks using anywidget"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
keywords = ["anywidget", "graph", "visualization", "jupyter", "marimo", "cypher", "neo4j"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "anywidget>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "marimo>=0.25.2; python_version < '3.15'",
    # The demo tests load the published dataset, at the demo extra's range
    "grafeo-datasets>=0.6.3",
]
networkx = ["networkx>=3.7.0"]
pandas = ["pandas>=3.1.1"]
grafeo = ["grafeo>=0.6.3,<0.7"]
cosmosdb = ["gremlinpython>=3.8.2"]
neo4j = ["neo4j>=6.4.1"]
arango = ["python-arango>=8.3.7"]
# marimo, to run the apps in examples/; it pulls in loro, which has no Python 3.15 wheels yet
examples = ["marimo>=0.25.2; python_version < '3.15'"]
embed = []  # Marker extra: WASM loads from CDN on demand
# demo_graph(): grafeo's Silicon Valley demo dataset; the browser loads the engine and the dataset from jsDelivr
demo = ["grafeo-datasets>=0.6.3"]
# Marker extra: the 3D view (Graph3D / view="3d"); Three.js is bundled in the wheel, so it needs no extra Python deps
3d = []

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/anywidget-graph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_graph"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "examples",
    "scripts",
    "assets",
    ".github",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "uv.lock",
    ".python-version",
    ".gitattributes",
    ".gitignore",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
# The marimo apps in examples/ import marimo, which does not install on Python 3.15 yet (loro has no 3.15 wheels)
allowed-unresolved-imports = ["marimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.prek]
repos = [
    { repo = "ruff", hooks = [
        { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
        { id = "ruff-format" },
    ]},
]

[dependency-groups]
dev = [
    "anywidget-graph[grafeo,demo]",  # Engine contract and demo tests run against the pinned extras
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
