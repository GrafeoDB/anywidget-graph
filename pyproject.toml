[project]
name = "anywidget-graph"
version = "0.5.1"
description = "Interactive graph visualization for Python notebooks using anywidget"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
keywords = ["anywidget", "graph", "visualization", "jupyter", "marimo", "cypher", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "anywidget>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "prek>=0.5.7",
    "pytest>=9.2",
    "ruff>=0.17.3",
    "ty>=0.0.94",
    "marimo>=0.25.2; python_version < '3.15'",
]
networkx = ["networkx>=3"]
pandas = ["pandas>=3"]
grafeo = ["grafeo~=0.6.0"]
cosmosdb = ["gremlinpython>=3.8"]
neo4j = ["neo4j>=5"]
arango = ["python-arango>=8"]
# marimo, to run the apps in examples/; it pulls in loro, which has no Python 3.15 wheels yet
examples = ["marimo>=0.19.9; python_version < '3.15'"]
embed = []  # Marker extra: WASM loads from CDN on demand
demo = []  # Marker extra: enables demo mode with pre-populated dataset

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/anywidget-graph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_graph"]

[tool.hatch.build.targets.sdist]
# Local agent notes and settings (ignored only by a global gitignore) stay out of a locally built sdist
exclude = [".claude"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# The marimo apps in examples/ import marimo, which does not install on Python 3.15 yet (loro has no 3.15 wheels)
allowed-unresolved-imports = ["marimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.prek]
repos = [
    { repo = "ruff", hooks = [
        { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
        { id = "ruff-format" },
    ]},
]

[dependency-groups]
dev = [
    "anywidget-graph[grafeo]",  # Engine contract tests run against the pinned grafeo extra
    "pytest>=9.2",
    "ruff>=0.17.3",
]
