name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      # Without this, uv follows .python-version and every job runs 3.12
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major tags since v8: pin the release commit (its tag in the comment), as anywidget-vector does
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The suite parses the ESM bundle and runs the browser-side modules with Node
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --dev

      # esbuild, so the tests can check that ui/dist/widget.js is built from the current sources
      - name: Install the bundler
        run: npm ci --prefix scripts/vendor

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      # The optional drivers (neo4j, python-arango, ...) are installed, so ty checks the backends against them
      - name: Run ty check
        run: uv run --all-extras ty check

      - name: Run tests
        run: uv run pytest -v

  # The front end in Chromium, mounted through a plain model as an app hosts it (tests/e2e)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Chromium for Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: uv run --with playwright pytest tests/e2e -v
