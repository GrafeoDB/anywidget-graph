body {{ margin: 0; background: {background}; font-family: sans-serif; }}
/* The frame (1px border) sits inside the given size, so a 100% wide scene never scrolls sideways */
#wrapper {{ box-sizing: border-box; width: {width}; height: {height}; }}
#container {{ position: relative; width: 100%; height: 100%; }}
</style>
<style>
/* The widget's styles: the 3D view's controls, tooltip and selection overlays */
{css}
</style>
</head>

<div id="wrapper" class="awg-wrapper awg-wrapper-3d">
<div id="container" class="awg-graph-container awg3-container"></div>
</div>
<script type="module">
// Three.js and OrbitControls are inlined (the widget's bundled copy): the page needs no CDN
{vendor_js_3d}

const DATA = {json_data};
const OPTIONS = {json_options};

// the 3D renderer, bundled from ui/export3d.ts by scripts/vendor/build-esm.mjs (tooltips are built from text)
{export_js}
</script>
</body>
</html>
